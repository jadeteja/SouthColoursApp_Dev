server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: southcolours-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:southcolours_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:southcolours_user}
    password: ${DB_PASSWORD:southcolours_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:jade.teja@gmail.com}
    password: ${MAIL_PASSWORD:wyforusvshvxosej}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 25MB

app:
  jwt:
    secret: ${JWT_SECRET:supersecretjwtkeythatmustbeatleast256bitslonginproductionenvironment123456}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_Tplnc0eTN5xGQt}
    key-secret: ${RAZORPAY_KEY_SECRET:Sxmrg4J0p52g2JOb9iGp3S9P}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:southcolours}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:phzoirr6}
    api-key: ${CLOUDINARY_API_KEY:472424285177527}
    api-secret: ${CLOUDINARY_API_SECRET:iWJ2bVqOi9t-5SFfRc-sNBfuSQ0}
  cors:
    allowed-origins: "*"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
