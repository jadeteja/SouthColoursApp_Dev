version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: southcolours-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: southcolours_db
      MYSQL_USER: southcolours_user
      MYSQL_PASSWORD: southcolours_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
